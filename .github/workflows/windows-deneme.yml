name: Windows arayüz denemesi
# CastCanvas-Setup.exe'yi gerçek Windows'ta deneme kipinde (-deneme-arayuz: hiçbir şey kurmaz) çalıştırır,
# sayfa geçişlerini doğrular ve ekran görüntülerini saklar. Elle başlatılır.
on:
  workflow_dispatch:
    inputs:
      etiket:
        description: Denenecek sürüm etiketi
        required: true
        default: deneme

jobs:
  deneme:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dil: [tr, en]
    steps:
      - name: Kurulumu indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.etiket }}" --repo "${{ github.repository }}" --pattern "CastCanvas-Setup-Windows.zip"
          Expand-Archive CastCanvas-Setup-Windows.zip -DestinationPath kur
          Get-Item kur\CastCanvas-Setup.exe | Format-List Name, Length
          (Get-Item kur\CastCanvas-Setup.exe).VersionInfo | Format-List FileDescription, ProductName, FileVersion

      - name: Çalıştır, sayfaları gez, ekran görüntüsü al
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force ekran | Out-Null
          $p = Start-Process -FilePath kur\CastCanvas-Setup.exe -ArgumentList '-deneme-arayuz', '-dil', '${{ matrix.dil }}' -PassThru
          $i = 0
          while (-not $p.HasExited -and $i -lt 90) {
            Start-Sleep -Milliseconds 700
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save(("ekran\{0:D3}.png" -f $i), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "ekran görüntüsü alınamadı: $_" }
            $i++
          }
          if (-not $p.HasExited) { $p.Kill(); Write-Host "zaman aşımı"; exit 1 }
          Write-Host "çıkış kodu: $($p.ExitCode)"
          Get-Content "$env:TEMP\CastCanvasSetup\arayuz-deneme.txt"
          Copy-Item "$env:TEMP\CastCanvasSetup\arayuz-deneme.txt" ekran\
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-${{ matrix.dil }}
          path: ekran
